<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英語單字拼字大挑戰 | 10月 &amp; 11月主題測驗</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --secondary: #0ea5e9;
      --success: #10b981;
      --success-bg: #d1fae5;
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 14px 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Card */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none !important;
    }

    /* Form Elements */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 0.96rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 12px;
      border: none;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }

    .btn-warning {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-full {
      width: 100%;
    }

    /* Game Screen */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .badge {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .badge-primary { background: var(--primary-light); color: var(--primary-dark); }
    .badge-success { background: var(--success-bg); color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .prompt-box {
      text-align: center;
      padding: 20px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1.5px dashed #cbd5e1;
      margin-bottom: 24px;
    }

    .chinese-meaning {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .word-hint {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .audio-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .audio-btn {
      background: white;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Answer Slots */
    .slots-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 60px;
      margin-bottom: 24px;
      padding: 8px;
    }

    .letter-slot {
      width: 44px;
      height: 52px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary-dark);
      cursor: pointer;
      user-select: none;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .letter-slot.space-slot {
      width: 22px;
      border: none;
      background: transparent;
      cursor: default;
    }

    .letter-slot.filled {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.18);
    }

    .letter-slot.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #065f46;
      animation: bounce 0.45s ease;
    }

    .letter-slot.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #991b1b;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      70% { transform: translateY(-4px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease;
    }

    /* Scrambled Letter Bank */
    .bank-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 24px;
      min-height: 56px;
    }

    .tile-btn {
      width: 46px;
      height: 50px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      border-bottom-width: 4px;
      background: white;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .tile-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-3px);
    }

    .tile-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .feedback-banner {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }

    /* Result Screen */
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
    }

    .score-num {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1;
    }

    .score-label {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .report-preview {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #334155;
      margin-bottom: 18px;
    }

    .share-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .status-toast {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 12px;
      text-align: center;
    }

    /* Teacher Dashboard Table */
    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table.records-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    table.records-table th, table.records-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    table.records-table th {
      background: #f1f5f9;
      font-weight: 700;
      color: #475569;
    }

    .confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<div class="app-container">
  <header>
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <h1>英語單字拼字大挑戰</h1>
        <p>10月 &amp; 11月主題語音拼字練習</p>
      </div>
    </div>
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" id="tabStudent" onclick="switchTab('student')">🎮 學生練習</button>
      <button type="button" class="tab-btn" id="tabTeacher" onclick="switchTab('teacher')">📊 成績紀錄</button>
    </div>
  </header>

  <!-- ==================== 1. 學生練習頁面 ==================== -->
  <div id="studentSection">
    <!-- 開始設定畫面 -->
    <div class="card" id="setupCard">
      <div class="section-title">👋 學生基本資料與測驗設定</div>

      <div class="grid-2">
        <div class="form-group">
          <label for="classSeat">班級座號 <span style="color:var(--danger)">*</span></label>
          <input type="text" id="classSeat" placeholder="例如：302-15" required />
        </div>
        <div class="form-group">
          <label for="studentName">學生姓名 <span style="color:var(--danger)">*</span></label>
          <input type="text" id="studentName" placeholder="請輸入真實姓名" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group" id="topicSelectGroup">
          <label for="topicSelect">選擇單字主題</label>
          <select id="topicSelect">
            <option value="oct">10月（共 14 題）</option>
            <option value="nov">11月（共 16 題）</option>
          </select>
        </div>
        <div class="form-group">
          <label for="accentSelect">語音發音口音</label>
          <select id="accentSelect">
            <option value="en-US">美式英語 (US English)</option>
            <option value="en-GB">英式英語 (UK English)</option>
          </select>
        </div>
      </div>

      <!-- 隱藏的老師接收設定（已內建您的 Google Apps Script Webhook 網址） -->
      <div style="display: none;" aria-hidden="true">
        <input type="url" id="webhookUrl" value="https://script.google.com/macros/s/AKfycbz5h7fLyVc49v0gHcUIGFHRPDQ4LJA37t4B3uL_M3T80Efrd3wwshOuvG3DC6vnHotUQg/exec" />
      </div>

      <button type="button" class="btn btn-primary btn-full" onclick="startGame()" style="margin-top: 8px; font-size: 1.05rem; padding: 14px;">
        🚀 開始拼字挑戰
      </button>
    </div>

    <!-- 遊戲作答畫面 -->
    <div class="card hidden" id="gameCard">
      <div class="game-header">
        <div>
          <span class="badge badge-primary" id="progressText">第 1 / 14 題</span>
          <span class="badge badge-warning" id="streakBadge" style="margin-left:6px;">🔥 連對 0</span>
        </div>
        <div>
          得分：<span id="liveScore" style="color:var(--primary); font-size:1.1rem;">0</span> 分
        </div>
      </div>

      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <div class="prompt-box">
        <div class="chinese-meaning" id="meaningText">多雲的</div>
        <div class="word-hint" id="hintText">提示：6 個英文字母</div>
        <div class="audio-controls">
          <button type="button" class="audio-btn" onclick="speakCurrentWord(0.95)">🔊 正常發音</button>
          <button type="button" class="audio-btn" onclick="speakCurrentWord(0.6)">🐢 慢速朗讀</button>
        </div>
      </div>

      <!-- 拼字空格區 -->
      <div class="slots-container" id="slotsContainer"></div>

      <!-- 打亂字母區 -->
      <div class="bank-container" id="bankContainer"></div>

      <div class="action-row">
        <button type="button" class="btn btn-secondary" onclick="backspaceLetter()">⌫ 退格</button>
        <button type="button" class="btn btn-secondary" onclick="clearCurrentInput()">🔄 清空重拼</button>
        <button type="button" class="btn btn-warning" onclick="useHint()">💡 提示一字母 (-2分)</button>
        <button type="button" class="btn btn-primary" id="submitWordBtn" onclick="checkAnswer()">✅ 確認送出</button>
      </div>

      <div class="feedback-banner hidden" id="feedbackBanner"></div>
    </div>

    <!-- 結算與成績回傳畫面 -->
    <div class="card hidden" id="resultCard">
      <div style="text-align: center; margin-bottom: 18px;">
        <div class="score-circle">
          <div class="score-num" id="finalScore">100</div>
          <div class="score-label">總得分</div>
        </div>
        <h2 style="font-size: 1.4rem; margin-bottom: 4px;" id="resultHeadline">太棒了，挑戰完成！</h2>
        <p style="color: var(--muted); font-size: 0.92rem;" id="resultSubtext">成績已自動儲存，系統正在同步回傳給老師</p>
      </div>

      <!-- 自動雲端同步狀態提示 -->
      <div id="autoSyncBanner" class="status-toast" style="background: #e0f2fe; color: #0369a1; margin-bottom: 16px;">
        ⏳ 正在將成績自動傳送至老師的 Google 試算表...
      </div>

      <div class="section-title">📋 成績單明細（含防偽驗證碼）</div>
      <div class="report-preview" id="reportPreview"></div>

      <div class="share-grid">
        <button type="button" class="btn btn-success" id="btnSendWebhook" onclick="sendToWebhook()">☁️ 手動重新傳送至試算表</button>
        <button type="button" class="btn btn-primary" onclick="copyReport()">📋 複製成績單 (貼給 LINE)</button>
        <button type="button" class="btn btn-secondary" onclick="downloadSingleCSV()">📥 下載成績 CSV 檔</button>
      </div>

      <div id="shareToast" class="status-toast hidden"></div>

      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button type="button" class="btn btn-secondary btn-full" onclick="restartSameTopic()">🔁 再挑戰一次</button>
        <button type="button" class="btn btn-secondary btn-full" onclick="backToSetup()">🏠 返回首頁設定</button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 老師成績紀錄後台 ==================== -->
  <div id="teacherSection" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <div class="section-title" style="margin-bottom:0;">📊 本機裝置成績紀錄總表</div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-success" onclick="exportAllCSV()">📥 匯出全部成績 (CSV)</button>
          <button type="button" class="btn btn-danger" onclick="clearAllRecords()">🗑️ 清空紀錄</button>
        </div>
      </div>
      <p style="font-size:0.85rem; color:var(--muted); margin-bottom:12px;">
        此頁面會彙整在此瀏覽器上完成的所有學生測驗紀錄；同時每筆成績亦會自動寫入您設定的 Google 試算表。
      </p>
      <div class="table-wrap">
        <table class="records-table">
          <thead>
            <tr>
              <th>提交時間</th>
              <th>班級座號</th>
              <th>姓名</th>
              <th>主題</th>
              <th>得分</th>
              <th>答對</th>
              <th>待加強單字</th>
              <th>驗證碼</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // ==================== 內建預設 Webhook 網址 ====================
  const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz5h7fLyVc49v0gHcUIGFHRPDQ4LJA37t4B3uL_M3T80Efrd3wwshOuvG3DC6vnHotUQg/exec";

  // ==================== 10月 & 11月 單字題庫 ====================
  const WORD_BANKS = {
    oct: {
      name: "10月",
      words: [
        { word: "Cloudy", meaning: "多雲的 / 陰天的", hint: "天空有很多雲的天氣" },
        { word: "Eraser", meaning: "橡皮擦", hint: "寫錯字時用來擦掉的文具" },
        { word: "Write", meaning: "寫 / 書寫", hint: "拿筆在紙上寫字" },
        { word: "Umbrella", meaning: "雨傘", hint: "下雨天出門必備用品" },
        { word: "Ice Cream", meaning: "冰淇淋", hint: "冰冰涼涼的甜點（2 個單字）" },
        { word: "Backpack", meaning: "後背包 / 書包", hint: "背在背上的包包" },
        { word: "Taro", meaning: "芋頭", hint: "紫色澱粉類食物，常做芋圓或芋泥" },
        { word: "Chocolate", meaning: "巧克力", hint: "可可製成的香甜零食" },
        { word: "Dessert", meaning: "甜點 / 飯後點心", hint: "正餐後吃的甜食" },

  // ==================== 遊戲狀態變數 ====================
  let currentWords = [];
  let currentTopicName = "";
  let currentIndex = 0;
  let score = 0;
  let streak = 0;
  let correctCount = 0;
  let wrongWordsList = [];
  let currentGuess = [];      // 僅存放實際英文字母 { char, tileIndex }
  let scrambledTiles = [];    // 打亂後的純英文字母陣列
  let isQuestionLocked = false;
  let hintUsedInCurrent = false;
  let latestResultData = null;

  // ==================== 音效合成器 (Web Audio API) ====================
  let audioCtx = null;

  function playTone(freq, type = "sine", duration = 0.12, delay = 0) {
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    } catch (e) {}
  }

  function playClickSound() { playTone(520, "triangle", 0.07); }
  function playSuccessSound() {
    playTone(523.25, "sine", 0.14, 0);
    playTone(659.25, "sine", 0.14, 0.1);
    playTone(783.99, "sine", 0.25, 0.2);
  }
  function playErrorSound() {
    playTone(220, "sawtooth", 0.18, 0);
    playTone(180, "sawtooth", 0.24, 0.14);
  }

  // ==================== 初始化 ====================
  function initApp() {
    try {
      const savedClass = localStorage.getItem("sp_classSeat");
      const savedName = localStorage.getItem("sp_studentName");
      if (savedClass) document.getElementById("classSeat").value = savedClass;
      if (savedName) document.getElementById("studentName").value = savedName;
    } catch (e) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initApp);
  } else {
    initApp();
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // ==================== 分頁切換 ====================
  function switchTab(tab) {
    document.getElementById("tabStudent").classList.toggle("active", tab === "student");
    document.getElementById("tabTeacher").classList.toggle("active", tab === "teacher");

    document.getElementById("studentSection").classList.toggle("hidden", tab !== "student");
    document.getElementById("teacherSection").classList.toggle("hidden", tab !== "teacher");

    if (tab === "teacher") renderRecordsTable();
  }

  // 取得不含空格的純字母目標字串（支援 Ice Cream / Moon Cake 雙字詞）
  function getCleanLetters(wordStr) {
    return String(wordStr || "").toLowerCase().replace(/[^a-z]/g, "");
  }

  // ==================== 開始遊戲 ====================
  function startGame() {
    const classSeat = document.getElementById("classSeat").value.trim();
    const studentName = document.getElementById("studentName").value.trim();

    if (!classSeat || !studentName) {
      alert("請先填寫「班級座號」與「學生姓名」，方便老師登記成績喔！");
      return;
    }

    try {
      localStorage.setItem("sp_classSeat", classSeat);
      localStorage.setItem("sp_studentName", studentName);
    } catch (e) {}

    const topicKey = document.getElementById("topicSelect").value;
    const bank = WORD_BANKS[topicKey] || WORD_BANKS.oct;

    currentWords = shuffleArray([...bank.words]);
    currentTopicName = bank.name;
    currentIndex = 0;
    score = 0;
    streak = 0;
    correctCount = 0;
    wrongWordsList = [];

    document.getElementById("setupCard").classList.add("hidden");
    document.getElementById("resultCard").classList.add("hidden");
    document.getElementById("gameCard").classList.remove("hidden");

    loadQuestion();
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ==================== 載入題目與語音 ====================
  function loadQuestion() {
    isQuestionLocked = false;
    hintUsedInCurrent = false;
    currentGuess = [];

    const item = currentWords[currentIndex];
    const total = currentWords.length;
    const cleanTarget = getCleanLetters(item.word);

    document.getElementById("progressText").textContent = "第 " + (currentIndex + 1) + " / " + total + " 題";
    document.getElementById("streakBadge").textContent = "🔥 連對 " + streak;
    document.getElementById("liveScore").textContent = score;
    document.getElementById("progressBar").style.width = ((currentIndex / total) * 100) + "%";

    document.getElementById("meaningText").textContent = item.meaning;
    const hintPrefix = item.hint ? ("提示：" + item.hint + "（") : "提示：共 ";
    document.getElementById("hintText").textContent = hintPrefix + cleanTarget.length + " 個英文字母" + (item.hint ? "）" : "");

    const fb = document.getElementById("feedbackBanner");
    fb.classList.add("hidden");
    fb.className = "feedback-banner hidden";

    scrambledTiles = shuffleArray(cleanTarget.split(""));
    renderSlotsAndBank();

    setTimeout(() => speakCurrentWord(0.95), 350);
  }

  function speakCurrentWord(rate = 0.95) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const item = currentWords[currentIndex];
    const utter = new SpeechSynthesisUtterance(item.word);
    utter.lang = document.getElementById("accentSelect").value || "en-US";
    utter.rate = rate;
    window.speechSynthesis.speak(utter);
  }

  // ==================== 渲染空格與字母按鈕 ====================
  function renderSlotsAndBank() {
    const item = currentWords[currentIndex];
    const rawChars = item.word.split("");
    const slotsEl = document.getElementById("slotsContainer");
    const bankEl = document.getElementById("bankContainer");

    slotsEl.innerHTML = "";
    let letterSlotIdx = 0;

    for (let i = 0; i < rawChars.length; i++) {
      const ch = rawChars[i];
      if (ch === " ") {
        const spacer = document.createElement("div");
        spacer.className = "letter-slot space-slot";
        slotsEl.appendChild(spacer);
        continue;
      }

      const currentLetterPos = letterSlotIdx;
      const slot = document.createElement("div");
      slot.className = "letter-slot";
      if (currentGuess[currentLetterPos]) {
        slot.textContent = currentGuess[currentLetterPos].char;
        slot.classList.add("filled");
        slot.onclick = () => {
          if (!isQuestionLocked) removeLetterAt(currentLetterPos);
        };
      }
      slotsEl.appendChild(slot);
      letterSlotIdx++;
    }

    const usedIndices = new Set(currentGuess.map(g => g.tileIndex));
    bankEl.innerHTML = "";
    scrambledTiles.forEach((char, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tile-btn";
      btn.textContent = char;
      btn.disabled = usedIndices.has(idx) || isQuestionLocked;
      btn.onclick = () => selectTile(idx);
      bankEl.appendChild(btn);
    });
  }

  function selectTile(tileIndex) {
    if (isQuestionLocked) return;
    const targetLen = getCleanLetters(currentWords[currentIndex].word).length;
    if (currentGuess.length >= targetLen) return;

    playClickSound();
    currentGuess.push({ char: scrambledTiles[tileIndex], tileIndex: tileIndex });
    renderSlotsAndBank();
  }

  function removeLetterAt(slotIndex) {
    playClickSound();
    currentGuess.splice(slotIndex, 1);
    renderSlotsAndBank();
  }

  function backspaceLetter() {
    if (isQuestionLocked || currentGuess.length === 0) return;
    playClickSound();
    currentGuess.pop();
    renderSlotsAndBank();
  }

  function clearCurrentInput() {
    if (isQuestionLocked) return;
    playClickSound();
    currentGuess = [];
    renderSlotsAndBank();
  }

  function useHint() {
    if (isQuestionLocked) return;
    const targetWord = getCleanLetters(currentWords[currentIndex].word);
    let nextPos = 0;
    while (nextPos < currentGuess.length && currentGuess[nextPos].char === targetWord[nextPos]) {
      nextPos++;
    }
    if (nextPos >= targetWord.length) return;

    currentGuess = currentGuess.slice(0, nextPos);
    const neededChar = targetWord[nextPos];
    const usedIndices = new Set(currentGuess.map(g => g.tileIndex));
    const foundTileIdx = scrambledTiles.findIndex((c, idx) => c === neededChar && !usedIndices.has(idx));

    if (foundTileIdx !== -1) {
      playClickSound();
      currentGuess.push({ char: neededChar, tileIndex: foundTileIdx });
      if (!hintUsedInCurrent) {
        score = Math.max(0, score - 2);
        document.getElementById("liveScore").textContent = score;
        hintUsedInCurrent = true;
      }
      renderSlotsAndBank();
    }
  }

  // 支援實體鍵盤打字
  document.addEventListener("keydown", (e) => {
    if (document.getElementById("studentSection").classList.contains("hidden")) return;
    if (document.getElementById("gameCard").classList.contains("hidden") || isQuestionLocked) return;
    if (e.key === "Backspace") {
      e.preventDefault();
      backspaceLetter();
    } else if (e.key === "Enter") {
      e.preventDefault();
      checkAnswer();
    } else if (/^[a-zA-Z]$/.test(e.key)) {
      const ch = e.key.toLowerCase();
      const usedIndices = new Set(currentGuess.map(g => g.tileIndex));
      const idx = scrambledTiles.findIndex((c, i) => c === ch && !usedIndices.has(i));
      if (idx !== -1) selectTile(idx);
    }
  });

  // ==================== 檢查答案 ====================
  function checkAnswer() {
    if (isQuestionLocked) return;
    const item = currentWords[currentIndex];
    const targetClean = getCleanLetters(item.word);
    const userClean = currentGuess.map(g => g.char).join("");

    if (userClean.length < targetClean.length) {
      const slotsEl = document.getElementById("slotsContainer");
      slotsEl.classList.remove("shake");
      void slotsEl.offsetWidth;
      slotsEl.classList.add("shake");
      return;
    }

    isQuestionLocked = true;
    const fb = document.getElementById("feedbackBanner");
    const slots = document.querySelectorAll(".letter-slot:not(.space-slot)");
    const pointsPerWord = Math.round(100 / currentWords.length);

    if (userClean === targetClean) {
      playSuccessSound();
      streak++;
      correctCount++;
      score += pointsPerWord;
      if (currentIndex === currentWords.length - 1 && correctCount === currentWords.length && !hintUsedInCurrent) {
        score = 100;
      }
      document.getElementById("liveScore").textContent = score;
      document.getElementById("streakBadge").textContent = "🔥 連對 " + streak;

      slots.forEach(s => s.classList.add("correct"));
      fb.textContent = "🎉 答對了！正確拼法：" + item.word;
      fb.style.background = "var(--success-bg)";
      fb.style.color = "#065f46";
      fb.classList.remove("hidden");
    } else {
      playErrorSound();
      streak = 0;
      document.getElementById("streakBadge").textContent = "🔥 連對 0";
      wrongWordsList.push(item.word + " (" + item.meaning + ")");

      slots.forEach(s => s.classList.add("wrong"));
      fb.textContent = "❌ 拼錯囉！你的拼法：" + userClean + " ｜ 正確答案：" + item.word;
      fb.style.background = "var(--danger-bg)";
      fb.style.color = "#991b1b";
      fb.classList.remove("hidden");
    }

    speakCurrentWord(0.9);
    renderSlotsAndBank();

    setTimeout(() => {
      currentIndex++;
      if (currentIndex < currentWords.length) {
        loadQuestion();
      } else {
        finishGame();
      }
    }, 1700);
  }

  // ==================== 結算與自動回傳成績 ====================
  function finishGame() {
    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("gameCard").classList.add("hidden");
    document.getElementById("resultCard").classList.remove("hidden");

    const classSeat = document.getElementById("classSeat").value.trim();
    const studentName = document.getElementById("studentName").value.trim();
    const totalCount = currentWords.length;
    const now = new Date();
    const timestamp = now.toLocaleString("zh-TW", { hour12: false });

    const rawSig = classSeat + "|" + studentName + "|" + score + "|" + correctCount + "/" + totalCount + "|" + now.getMinutes();
    let hash = 0;
    for (let i = 0; i < rawSig.length; i++) {
      hash = ((hash << 5) - hash) + rawSig.charCodeAt(i);
      hash |= 0;
    }
    const verificationCode = "SP-" + Math.abs(hash).toString(36).toUpperCase().padStart(6, "0");

    latestResultData = {
      timestamp: timestamp,
      classSeat: classSeat,
      studentName: studentName,
      topic: currentTopicName,
      score: score,
      correctCount: correctCount,
      totalCount: totalCount,
      wrongWords: wrongWordsList.length > 0 ? wrongWordsList.join("、") : "無（全數通過）",
      verificationCode: verificationCode
    };

    try {
      const records = JSON.parse(localStorage.getItem("sp_teacher_records") || "[]");
      records.unshift(latestResultData);
      localStorage.setItem("sp_teacher_records", JSON.stringify(records));
    } catch (e) {}

    document.getElementById("finalScore").textContent = score;
    if (score >= 90) {
      document.getElementById("resultHeadline").textContent = "🏆 太神啦！拼字大師就是你！";
      launchConfetti();
    } else if (score >= 70) {
      document.getElementById("resultHeadline").textContent = "👏 表現很棒，繼續保持！";
      launchConfetti();
    } else {
      document.getElementById("resultHeadline").textContent = "💪 練習完成，把錯題多念幾次會更棒！";
    }

    const reportText = [
      "【英語單字拼字測驗成績單】",
      "提交時間：" + latestResultData.timestamp,
      "班級座號：" + latestResultData.classSeat,
      "學生姓名：" + latestResultData.studentName,
      "測驗主題：" + latestResultData.topic,
      "測驗得分：" + latestResultData.score + " 分（答對 " + latestResultData.correctCount + " / " + latestResultData.totalCount + " 題）",
      "待加強單字：" + latestResultData.wrongWords,
      "防偽驗證碼：" + latestResultData.verificationCode
    ].join("\n");

    document.getElementById("reportPreview").textContent = reportText;

    autoSendToGoogleSheet();
  }

  async function autoSendToGoogleSheet() {
    const banner = document.getElementById("autoSyncBanner");
    const url = document.getElementById("webhookUrl").value.trim() || DEFAULT_WEBHOOK_URL;
    if (!url || !latestResultData) return;

    banner.style.background = "#e0f2fe";
    banner.style.color = "#0369a1";
    banner.textContent = "⏳ 正在將成績自動傳送至老師的 Google 試算表...";

    try {
      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(latestResultData)
      });
      banner.style.background = "var(--success-bg)";
      banner.style.color = "#065f46";
      banner.textContent = "✅ 成績已自動回傳至老師的 Google 試算表！";
    } catch (err) {
      banner.style.background = "var(--danger-bg)";
      banner.style.color = "#991b1b";
      banner.textContent = "⚠️ 自動傳送連線異常，請點擊下方「手動重新傳送」或複製成績單傳給老師。";
    }
  }

  function downloadSingleCSV() {
    if (!latestResultData) return;
    const headers = ["提交時間", "班級座號", "學生姓名", "測驗主題", "得分", "答對題數", "總題數", "待加強單字", "防偽驗證碼"];
    const row = [
      latestResultData.timestamp,
      latestResultData.classSeat,
      latestResultData.studentName,
      latestResultData.topic,
      latestResultData.score,
      latestResultData.correctCount,
      latestResultData.totalCount,
      latestResultData.wrongWords,
      latestResultData.verificationCode
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",");

    const csvContent = "\uFEFF" + headers.join(",") + "\n" + row;
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "拼字成績_" + latestResultData.classSeat + "_" + latestResultData.studentName + ".csv";
    link.click();
  }

      r.correctCount, r.totalCount, r.wrongWords, r.verificationCode
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","));

    const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "全班英語拼字成績總表_" + new Date().toISOString().slice(0,10) + ".csv";
    link.click();
  }

  function clearAllRecords() {
    if (confirm("確定要清空此裝置上的所有本地成績紀錄嗎？（不會影響已寫入 Google 試算表的資料）")) {
      localStorage.removeItem("sp_teacher_records");
      renderRecordsTable();
    }
  }

  // ==================== 慶祝彩帶特效 ====================
  function launchConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ["#4f46e5", "#0ea5e9", "#10b981", "#f59e0b", "#ec4899"];
    const pieces = Array.from({ length: 85 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: Math.random() * 2 - 1,
      rot: Math.random() * 360
    }));

    let frame = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        p.rot += 4;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      frame++;
      if (frame < 150) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
  }
</script>
